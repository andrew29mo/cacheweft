[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheweft"
version = "0.0.1"
description = "Bounded verified artifact cache with a local daemon"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cacheweft = "cacheweft.cli:main"

[tool.setuptools.packages.find]
include = ["cacheweft*"]
